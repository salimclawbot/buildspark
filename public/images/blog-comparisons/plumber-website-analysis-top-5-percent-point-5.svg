<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">They make the next step feel low-risk comparison image</title>
  <desc id="desc">A side-by-side comparison showing what business owners do wrong and what they should do instead.</desc>
  <defs>

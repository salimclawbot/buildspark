  <rect x="72" y="590" width="1056" height="102" rx="20" fill="#111827" stroke="#374151" />
  <text x="104" y="628" fill="#fbbf24" font-size="20" font-weight="900" font-family="Inter, Arial, sans-serif">TAKEAWAY</text>
  <text x="104" y="662" fill="#e5e7eb" font-size="21" font-weight="700" font-family="Inter, Arial, sans-serif">Less friction means more quote requests.</text>
  <text x="600" y="628" fill="#ffffff" font-size="20" font-weight="900" font-family="Inter, Arial, sans-serif">DO THIS:</text>
  <text x="600" y="662" fill="#d1d5db" font-size="19" font-weight="650" font-family="Inter, Arial, sans-serif">Use a short form with name, phone, suburb, and job type. Tell visitors when you will reply.</text>
